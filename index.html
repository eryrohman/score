<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    let peer = null;
    let currentConn = null;
    let wakeLock = null;
    const roomId = "VOLI-" + Math.floor(1000 + Math.random() * 9000);

    window.onload = () => {
        initPeer();
        requestWakeLock();
    };

    function initPeer() {
        // Buat instance PeerJS baru
        peer = new Peer(roomId);

        peer.on('open', (id) => {
            document.getElementById('peer-id-display').innerText = id;
            const adminUrl = window.location.href.replace('index.html', 'admin.html') + '?room=' + id;
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: adminUrl, width: 140, height: 140 });
        });

        peer.on('connection', (conn) => {
            currentConn = conn;
            
            // Sembunyikan overlay ketika terhubung
            document.getElementById('pair-overlay').style.display = 'none';
            document.getElementById('conn-status').innerText = "Admin Terhubung";
            document.getElementById('conn-status').className = "status-badge status-online";

            conn.on('data', (data) => {
                renderScoreboard(data);
            });

            // Deteksi ketika koneksi terputus
            conn.on('close', () => {
                handleDisconnect();
            });

            conn.on('error', () => {
                handleDisconnect();
            });
        });

        // Jika koneksi server PeerJS sendiri yang terputus (misal RTM/Sinyal Internet Hilang Sejenak)
        peer.on('disconnected', () => {
            document.getElementById('conn-status').innerText = "Menghubungkan Ulang Server...";
            document.getElementById('conn-status').className = "status-badge status-offline";
            peer.reconnect(); // Otomatis re-connect ke signaling server
        });
    }

    function handleDisconnect() {
        currentConn = null;
        document.getElementById('conn-status').innerText = "Koneksi Terputus";
        document.getElementById('conn-status').className = "status-badge status-offline";
        // Tampilkan kembali QR Code agar Admin bisa scan / klik connect ulang tanpa mereset skor layar
        document.getElementById('pair-overlay').style.display = 'flex';
    }

    function renderScoreboard(data) {
        document.getElementById('display-name-a').innerText = data.teamA;
        document.getElementById('display-name-b').innerText = data.teamB;
        document.getElementById('score-a').innerText = data.scoreA;
        document.getElementById('score-b').innerText = data.scoreB;
        document.getElementById('sets-a').innerText = data.setsA;
        document.getElementById('sets-b').innerText = data.setsB;
        document.getElementById('current-set').innerText = data.currentSet;

        if (data.logoA) document.getElementById('logo-a').src = data.logoA;
        if (data.logoB) document.getElementById('logo-b').src = data.logoB;

        document.getElementById('serve-a').classList.toggle('active', data.serve === 'A');
        document.getElementById('serve-b').classList.toggle('active', data.serve === 'B');

        if (data.theme) document.documentElement.setAttribute('data-theme', data.theme);

        if (data.action === 'toggle_fullscreen') {
            if (!document.fullscreenElement) {
                document.getElementById('fullscreen-prompt').style.display = 'flex';
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        const tbody = document.getElementById('history-list');
        tbody.innerHTML = "";
        if (data.history && data.history.length > 0) {
            data.history.forEach((h) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td><b>Set ${h.set}</b></td><td>${h.scoreA}</td><td>${h.scoreB}</td>`;
                tbody.appendChild(tr);
            });
        }
    }

    function activateFullscreen() {
        document.documentElement.requestFullscreen().then(() => {
            document.getElementById('fullscreen-prompt').style.display = 'none';
        }).catch(() => {
            document.getElementById('fullscreen-prompt').style.display = 'none';
        });
    }

    function toggleTheme() {
        const cur = document.documentElement.getAttribute('data-theme');
        document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
        } else {
            document.exitFullscreen().catch(() => {});
        }
    }

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                document.getElementById('wakelock-txt').innerText = "Layar: On 💡";
            }
        } catch (err) {}
    }
</script>
